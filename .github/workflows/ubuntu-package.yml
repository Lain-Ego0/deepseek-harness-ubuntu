name: Ubuntu package

# Fork 定位：个人使用 + 开源展示，不 PR 主线。核心价值 = 快速跟上 upstream。
# - 每日自动 merge upstream/master 并构建（验证跟得上）
# - tag 触发时发布到 GitHub Release（deb + AppImage + SHA256SUMS）
# - 无 APT 仓库 / 无 GPG / 无 Docker smoke（个人用 dpkg -i 升级足够）

on:
  schedule:
    - cron: '0 20 * * *'   # UTC 20:00 = 北京时间 04:00，赶在上游白天更新后
  workflow_dispatch:
  push:
    tags: ['ubuntu-v*']

permissions:
  contents: write
  actions: write

concurrency:
  group: ubuntu-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disable-upstream:
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Disable all upstream workflows (keep ubuntu-package.yml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP="ubuntu-package.yml"
          OWNER_REPO="$GITHUB_REPOSITORY"
          WORKFLOWS=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$OWNER_REPO/actions/workflows?per_page=100" \
            | jq -r --arg keep "$KEEP" '.workflows[] | select(.state == "active" and (.path | endswith("/" + $keep) | not)) | "\(.id)\t\(.name)"')
          if [ -z "$WORKFLOWS" ]; then
            echo "no upstream workflows to disable (already clean)"
            exit 0
          fi
          while IFS=$'\t' read -r id name; do
            echo "  disable: $name (id=$id)"
            curl -sf -X PUT -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$OWNER_REPO/actions/workflows/$id/disable" > /dev/null \
              || echo "  (already disabled or error, continue)"
          done <<< "$WORKFLOWS"
          echo "==> upstream workflows disabled"

  sync-upstream:
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream/master
        run: |
          git config user.name "ubuntu-package-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git || true
          git fetch upstream master --tags || true
          git merge upstream/master --no-edit || {
            echo "::error::merge conflict - resolve locally then push"
            git diff --name-only --diff-filter=U || true
            exit 1
          }

      - name: Push updated master
        run: git push origin HEAD:master

  build:
    runs-on: ubuntu-24.04
    needs: [sync-upstream]
    if: always() && !failure() && !cancelled()
    steps:
      # 关键：sync push 之后 master 已更新，这里 checkout 最新 master
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show build context
        run: |
          echo "HEAD: $(git rev-parse HEAD)"
          echo "master: $(git rev-parse origin/master 2>/dev/null || echo 'no origin/master')"
          git log --oneline -3
          node --version
          pnpm --version

      - name: Build Linux artifacts (x64)
        run: ./scripts/linux/package-ubuntu.sh x64

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage dist/
          cp apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.deb dist/
          (cd dist && sha256sum *.AppImage *.deb > SHA256SUMS.txt)
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS.txt
          retention-days: 7

  release:
    runs-on: ubuntu-24.04
    needs: [build]
    if: >-
      always() && !cancelled()
      && github.event_name == 'push'
      && startsWith(github.ref_name, 'ubuntu-v')
      && needs.build.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DeepSeek Harness Ubuntu ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Ubuntu packaging of [deepseek-ai/deepseek-harness](https://github.com/deepseek-ai/deepseek-harness).

            **Install (Ubuntu 24.04 / 22.04)**:
            ```bash
            sudo dpkg -i deepseek-harness-*-linux-amd64-unsigned.deb
            sudo apt -f install
            ```

            **AppImage (portable)**:
            ```bash
            chmod +x deepseek-harness-*-linux-x86_64-unsigned.AppImage
            ./deepseek-harness-*-linux-x86_64-unsigned.AppImage
            ```
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'alpha') }}
